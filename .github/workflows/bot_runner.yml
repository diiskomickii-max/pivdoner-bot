name: PivDoner Bot — Keep-Alive & Health Check

# ⚠️ ВАЖНО: GitHub Actions НЕ подходит для запуска Telegram polling-бота 24/7:
#   • Job живёт максимум ~6 часов и убивается раньше по timeout-minutes
#   • SQLite-файл не персистентен между ранами — база заказов теряется
#   • Параллельный polling конфликтует с основным инстансом бота
#
# Правильный деплой 24/7: Render / Railway / VPS (см. DEPLOY.md).
# Этот workflow — только будильник: пингует /health endpoint,
# чтобы бесплатный хостинг не усыпал сервис, и проверяет, что бот жив.

on:
  schedule:
    # Пинг каждые 10 минут — Render засыпает после 15 минут неактивности
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping bot health endpoint
        env:
          HEALTH_URL: ${{ secrets.BOT_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "⚠️ Secret BOT_HEALTH_URL не задан — пропуск пинга."
            echo "Добавь его в Settings → Secrets → Actions, например: https://pivdoner-bot.onrender.com/health"
            exit 0
          fi
          echo "Пингую $HEALTH_URL ..."
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$HEALTH_URL" || echo "000")
          echo "HTTP код ответа: $code"
          if [ "$code" != "200" ]; then
            echo "❌ Бот не отвечает! Проверь хостинг."
            exit 1
          fi
          echo "✅ Бот жив и отвечает."
