<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ПивДонер — Шаурма & Гриль Минск</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #121316;
      --card-bg: #1c1d22;
      --card-border: #2c2d35;
      --text: #ffffff;
      --text-muted: #8e909a;
      --accent: #ff9f1c;
      --accent-hover: #f39209;
      --green: #2ec4b6;
      --red: #e71d36;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 90px;
    }

    /* Шапка */
    header {
      background: linear-gradient(180deg, #24252d 0%, #17181f 100%);
      padding: 18px 16px 14px;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title span {
      color: var(--accent);
    }

    .brand-badge {
      background: rgba(255, 159, 28, 0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 20px;
      border: 1px solid rgba(255, 159, 28, 0.3);
    }

    .address-line {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Категории */
    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cat-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 700;
    }

    /* Список блюд */
    .menu-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 6px 16px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      gap: 14px;
      position: relative;
      transition: transform 0.15s ease;
    }

    .item-card:active {
      transform: scale(0.99);
    }

    .item-img {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      background: #252730;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      flex-shrink: 0;
    }

    .item-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .item-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
    }

    .item-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .item-weight {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .item-desc {
      font-size: 12px;
      color: #a8aab4;
      line-height: 1.35;
      margin: 6px 0 8px;
    }

    .item-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }

    .item-price {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent);
    }

    .btn-add {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-add:active {
      background: var(--accent-hover);
    }

    .qty-counter {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #272832;
      border-radius: 18px;
      padding: 3px 8px;
    }

    .qty-btn {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
      width: 24px;
      height: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-num {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      min-width: 14px;
      text-align: center;
    }

    /* Плавающая панель корзины */
    .cart-bar {
      position: fixed;
      bottom: 14px;
      left: 16px;
      right: 16px;
      background: var(--accent);
      color: #000;
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(255, 159, 28, 0.4);
      cursor: pointer;
      z-index: 1000;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cart-bar:active {
      transform: scale(0.98);
    }

    .cart-bar.hidden {
      display: none;
    }

    .cart-info {
      display: flex;
      flex-direction: column;
    }

    .cart-count {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .cart-total {
      font-size: 18px;
      font-weight: 900;
    }

    .cart-btn-label {
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Модальное окно корзины */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 2000;
      display: none;
      align-items: flex-end;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg);
      border-top: 1px solid var(--card-border);
      width: 100%;
      border-radius: 20px 20px 0 0;
      padding: 20px 18px 26px;
      max-height: 80vh;
      overflow-y: auto;
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
    }

    .modal-close {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }

    .cart-items-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .cart-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--card-border);
    }

    .order-action-btn {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 159, 28, 0.35);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-title">🍺 ПИВ<span>ДОНЕР</span></div>
      <div class="brand-badge">МИНСК • ОДИНЦОВА, 20</div>
    </div>
    <div class="address-line">🔥 Горячий стритфуд с открытого гриля • Доставка и самовывоз</div>
  </header>

  <div class="categories" id="catList">
    <button class="cat-btn active" onclick="filterCat('all')">Все блюда</button>
    <button class="cat-btn" onclick="filterCat('doners')">🌯 Донеры</button>
    <button class="cat-btn" onclick="filterCat('hotdogs')">🌭 Хот-доги</button>
    <button class="cat-btn" onclick="filterCat('lunch')">🍱 Ланчбоксы</button>
    <button class="cat-btn" onclick="filterCat('snacks')">🍟 Закуски</button>
    <button class="cat-btn" onclick="filterCat('drinks')">🥤 Напитки</button>
  </div>

  <div class="menu-grid" id="menuGrid"></div>

  <!-- Плавающая кнопка корзины -->
  <div class="cart-bar hidden" id="cartBar" onclick="openCartModal()">
    <div class="cart-info">
      <span class="cart-count" id="cartCountLabel">0 позиций</span>
      <span class="cart-total" id="cartTotalLabel">0.00 Br</span>
    </div>
    <div class="cart-btn-label">
      В корзину ➔
    </div>
  </div>

  <!-- Модалка оформления -->
  <div class="modal-overlay" id="cartModal" onclick="closeCartModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">🧺 Ваш заказ в «ПивДонер»</div>
        <button class="modal-close" onclick="closeCartModal()">✕</button>
      </div>

      <div class="cart-items-list" id="modalItemsList"></div>

      <div style="display:flex; justify-content:space-between; margin-bottom:16px; font-weight:700;">
        <span>Итого к оплате:</span>
        <span id="modalTotal" style="color:var(--accent); font-size:18px;">0.00 Br</span>
      </div>

      <button class="order-action-btn" onclick="submitOrderToBot()">
        🚀 Передать заказ в Telegram-бот
      </button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.enableClosingConfirmation(); } catch (e) {}
    }

    const MENU_ITEMS = [
      { id: "doner_classic", cat: "doners", icon: "🌯", name: "Донер Классик", weight: "380 г", price: 8.10, desc: "Куриное филе-гриль, пекинская капуста, сочные томаты, огурцы маринованные, лук, фирменный чесночный соус." },
      { id: "doner_grill", cat: "doners", icon: "🔥", name: "Донер Гриль", weight: "450 г", price: 12.15, desc: "Мясо-гриль на углях, жареный лук, томаты, маринованные огурчики, соус BBQ и нежный чесночный соус." },
      { id: "doner_america", cat: "doners", icon: "🍔", name: "Донер Америка", weight: "420 г", price: 13.10, desc: "Курица-гриль, бекон, сыр Чеддер, картофель фри, хрустящий лук, соус Бургер." },
      { id: "doner_bulbash", cat: "doners", icon: "🥔", name: "Донер Бульбаш", weight: "440 г", price: 13.50, desc: "Картофельные драники, филе куриное, бекон, маринованный лук, грибной сливочный соус." },
      { id: "doner_cheese", cat: "doners", icon: "🧀", name: "Донер Сырный", weight: "400 г", price: 13.90, desc: "Двойной сыр Моцарелла, Чеддер, сливочный пармезан, курица-гриль, сырный лаваш." },
      { id: "doner_spicy", cat: "doners", icon: "🌶", name: "Донер Спайси (Острый)", weight: "410 г", price: 13.10, desc: "Перец халапеньо, острый чили соус, курица, томаты, лук, хрустящие овощи." },
      { id: "hd_classic", cat: "hotdogs", icon: "🌭", name: "Хот-дог Классический", weight: "220 г", price: 6.50, desc: "Сосиска гриль, булочка бриошь, горчица французская, кетчуп, соленый огурец, хрустящий лук." },
      { id: "hd_cheese", cat: "hotdogs", icon: "🧀", name: "Хот-дог Четыре Сыра", weight: "240 г", price: 7.90, desc: "Сосиска в беконе, расплавленный чеддер, моцарелла, лук криспи." },
      { id: "lb_doner", cat: "lunch", icon: "🍱", name: "Ланчбокс Донер", weight: "460 г", price: 14.50, desc: "Мясо-гриль порционное, картофель фри, свежий салат Коул-Слоу, лаваш, два соуса." },
      { id: "snack_fries", cat: "snacks", icon: "🍟", name: "Картофель Фри XL", weight: "200 г", price: 5.50, desc: "Хрустящий картофель фри золотистой обжарки с морской солью." },
      { id: "snack_nuggets", cat: "snacks", icon: "🍗", name: "Наггетсы куриные (7 шт.)", weight: "180 г", price: 6.90, desc: "Нежное куриное филе в хрустящей панировке." },
      { id: "drink_cola", cat: "drinks", icon: "🥤", name: "Coca-Cola / Напиток 0.5л", weight: "0.5 л", price: 3.50, desc: "Охлаждённый газированный напиток в бутылочке." }
    ];

    let cart = {};
    let currentCat = "all";

    function filterCat(cat) {
      currentCat = cat;
      document.querySelectorAll(".cat-btn").forEach(btn => btn.classList.remove("active"));
      event.target.classList.add("active");
      renderMenu();
    }

    function renderMenu() {
      const grid = document.getElementById("menuGrid");
      grid.innerHTML = "";

      const filtered = currentCat === "all" ? MENU_ITEMS : MENU_ITEMS.filter(i => i.cat === currentCat);

      filtered.forEach(item => {
        const qty = cart[item.id] || 0;
        const card = document.createElement("div");
        card.className = "item-card";

        let actionHtml = "";
        if (qty === 0) {
          actionHtml = `<button class="btn-add" onclick="changeQty('${item.id}', 1)">+ Добавить</button>`;
        } else {
          actionHtml = `
            <div class="qty-counter">
              <button class="qty-btn" onclick="changeQty('${item.id}', -1)">−</button>
              <span class="qty-num">${qty}</span>
              <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="item-img">${item.icon}</div>
          <div class="item-info">
            <div>
              <div class="item-header">
                <span class="item-name">${item.name}</span>
              </div>
              <div class="item-weight">${item.weight}</div>
              <div class="item-desc">${item.desc}</div>
            </div>
            <div class="item-bottom">
              <div class="item-price">${item.price.toFixed(2)} Br</div>
              ${actionHtml}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      updateCartBar();
    }

    function changeQty(itemId, delta) {
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred("light");
      }
      cart[itemId] = (cart[itemId] || 0) + delta;
      if (cart[itemId] <= 0) delete cart[itemId];
      renderMenu();
    }

    function updateCartBar() {
      const bar = document.getElementById("cartBar");
      let count = 0;
      let total = 0.0;

      for (const [id, qty] of Object.entries(cart)) {
        const item = MENU_ITEMS.find(i => i.id === id);
        if (item) {
          count += qty;
          total += item.price * qty;
        }
      }

      if (count > 0) {
        bar.classList.remove("hidden");
        document.getElementById("cartCountLabel").innerText = `${count} позиц.`;
        document.getElementById("cartTotalLabel").innerText = `${total.toFixed(2)} Br`;
      } else {
        bar.classList.add("hidden");
      }
    }

    function openCartModal() {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");
      const list = document.getElementById("modalItemsList");
      list.innerHTML = "";
      let total = 0.0;

      for (const [id, qty] of Object.entries(cart)) {
        const item = MENU_ITEMS.find(i => i.id === id);
        if (!item) continue;
        const sub = item.price * qty;
        total += sub;

        const row = document.createElement("div");
        row.className = "cart-item-row";
        row.innerHTML = `
          <div>
            <b>${item.icon} ${item.name}</b>
            <div style="font-size:12px; color:var(--text-muted);">${qty} шт. × ${item.price.toFixed(2)} Br</div>
          </div>
          <div style="font-weight:700;">${sub.toFixed(2)} Br</div>
        `;
        list.appendChild(row);
      }

      document.getElementById("modalTotal").innerText = `${total.toFixed(2)} Br`;
      document.getElementById("cartModal").classList.add("active");
    }

    function closeCartModal(e) {
      document.getElementById("cartModal").classList.remove("active");
    }

    function submitOrderToBot() {
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      
      const payload = {
        action: "checkout",
        cart: cart,
        timestamp: new Date().toISOString()
      };

      if (tg && typeof tg.sendData === "function") {
        tg.sendData(JSON.stringify(payload));
      } else {
        alert("Заказ передан в Telegram-бот!");
        closeCartModal();
      }
    }

    // Первый запуск
    renderMenu();
  </script>
</body>
</html>
